<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">💪</span>
      <h1>FitLogger</h1>
    </div>
    <h2>Prijava</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="vas@email.com" />
        <span class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Unesite ispravan email.
        </span>
      </div>

      <div class="field">
        <label>Lozinka</label>
        <input type="password" formControlName="password" placeholder="••••••••" />
      </div>

      <div class="form-error" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Učitavanje...' : 'Prijavi se' }}
      </button>
    </form>

    <p class="auth-link">Nemaš nalog? <a routerLink="/register">Registruj se</a></p>
  </div>
</div>
