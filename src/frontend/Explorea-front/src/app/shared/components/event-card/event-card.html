<div class="event-card">
  <div class="event-card__image-wrap">
    <img [src]="event.previewImageUrl" [alt]="event.name" class="event-card__image" loading="lazy" />
    <span class="event-card__type-badge">{{ event.type.name }}</span>
    <span *ngIf="!event.price" class="event-card__free-badge">Besplatno</span>
  </div>
  <div class="event-card__body">
    <h3 class="event-card__name">{{ event.name }}</h3>
    <div class="event-card__info">
      <span class="event-card__date">
        <span class="material-icons">calendar_today</span>
        {{ formatDate(event.startDatetime) }}
      </span>
      <span class="event-card__location">
        <span class="material-icons">location_on</span>
        {{ event.city.name }}
      </span>
    </div>
    <div class="event-card__footer">
      <span *ngIf="event.price" class="event-card__price">od {{ event.price | number }} RSD</span>
      <span *ngIf="!event.price" class="event-card__price free">Besplatno</span>
    </div>
  </div>
</div>
