<div class="brm-overlay" (click)="close()">
  <div class="brm-panel" (click)="$event.stopPropagation()">

    <div class="brm-header">
      <div class="brm-title-wrap">
        <span class="material-icons brm-icon">bug_report</span>
        <h2>{{ 'BUG_REPORT.TITLE' | translate }}</h2>
      </div>
      <button class="brm-close" (click)="close()" type="button">
        <span class="material-icons">close</span>
      </button>
    </div>

    <!-- Success -->
    <div class="brm-success" *ngIf="submitted">
      <span class="material-icons brm-success__icon">check_circle</span>
      <h3>{{ 'BUG_REPORT.SUCCESS_TITLE' | translate }}</h3>
      <p>{{ 'BUG_REPORT.SUCCESS_MSG' | translate }}</p>
      <button class="brm-btn brm-btn--primary" (click)="close()" type="button">{{ 'BUG_REPORT.CLOSE' | translate }}</button>
    </div>

    <!-- Form -->
    <div class="brm-body" *ngIf="!submitted">

      <div class="brm-field">
        <label class="brm-label">{{ 'BUG_REPORT.SUBJECT_LABEL' | translate }} *</label>
        <input
          class="brm-input"
          [class.brm-input--error]="subjectError"
          type="text"
          [(ngModel)]="subject"
          [placeholder]="'BUG_REPORT.SUBJECT_PLACEHOLDER' | translate"
          maxlength="200"
          (ngModelChange)="subjectError = ''"
        />
        <p class="brm-error" *ngIf="subjectError">{{ subjectError }}</p>
      </div>

      <div class="brm-field" *ngIf="!isLoggedIn">
        <label class="brm-label">{{ 'BUG_REPORT.EMAIL_LABEL' | translate }}</label>
        <input
          class="brm-input"
          [class.brm-input--error]="emailError"
          type="email"
          [(ngModel)]="email"
          [placeholder]="'BUG_REPORT.EMAIL_PLACEHOLDER' | translate"
          (ngModelChange)="emailError = ''"
        />
        <p class="brm-error" *ngIf="emailError">{{ emailError }}</p>
      </div>

      <div class="brm-field">
        <label class="brm-label">{{ 'BUG_REPORT.DESC_LABEL' | translate }} *</label>
        <textarea
          class="brm-textarea"
          [class.brm-textarea--error]="descriptionError"
          [(ngModel)]="description"
          [placeholder]="'BUG_REPORT.DESC_PLACEHOLDER' | translate"
          rows="5"
          maxlength="2000"
          (ngModelChange)="descriptionError = ''"
        ></textarea>
        <p class="brm-error" *ngIf="descriptionError">{{ descriptionError }}</p>
      </div>

      <p class="brm-submit-error" *ngIf="submitError">{{ submitError }}</p>

      <div class="brm-actions">
        <button class="brm-btn brm-btn--ghost" (click)="close()" type="button">{{ 'BUG_REPORT.CANCEL' | translate }}</button>
        <button class="brm-btn brm-btn--primary" (click)="submit()" [disabled]="submitting" type="button">
          <span class="material-icons spin" *ngIf="submitting" style="font-size:16px">sync</span>
          <span *ngIf="!submitting">{{ 'BUG_REPORT.SUBMIT' | translate }}</span>
        </button>
      </div>
    </div>

  </div>
</div>
