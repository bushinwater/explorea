<div class="rp-overlay" *ngIf="isOpen" (click)="closed.emit()">
  <div class="rp-panel" (click)="$event.stopPropagation()">

    <div class="rp-header">
      <div class="rp-title-wrap">
        <h2>{{ title }}</h2>
        <span class="rp-subtitle">{{ subtitle }}</span>
      </div>
      <button class="rp-close" type="button" (click)="closed.emit()">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="rp-body">
      <div class="rp-list">
        <app-review-card
          *ngFor="let r of reviews"
          [review]="asDto(r)"
          [currentUserId]="currentUserId"
          (deleted)="deleted.emit($event)"
          (updated)="updated.emit($event)"
        />
      </div>
    </div>

  </div>
</div>
