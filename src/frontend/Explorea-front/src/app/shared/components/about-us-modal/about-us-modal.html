<div class="modal-overlay" (click)="closed.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <button class="modal-close" (click)="closed.emit()" aria-label="Zatvori">
      <span class="material-icons">close</span>
    </button>

    <div class="modal-logo">
      <img src="assets/committed-solutions-logo.jpeg" alt="Committed Solutions" class="team-logo" />
    </div>

    <h2 class="modal-title">{{ 'ABOUT_MODAL.TITLE' | translate }}</h2>
    <p class="modal-subtitle">Committed Solutions</p>

    <p class="modal-desc">
      {{ 'ABOUT_MODAL.DESC_1' | translate }}
      <strong>Committed Solutions</strong>
      {{ 'ABOUT_MODAL.DESC_2' | translate }}
    </p>

    <div class="modal-members">
      <div class="member">
        <span class="material-icons">person</span>
        <span>Stefan Mirković</span>
      </div>
      <div class="member">
        <span class="material-icons">person</span>
        <span>Lazar Ivanović</span>
      </div>
      <div class="member">
        <span class="material-icons">person</span>
        <span>Ana Tanasković</span>
      </div>
      <div class="member">
        <span class="material-icons">person</span>
        <span>Angelina Lazarević</span>
      </div>
      <div class="member">
        <span class="material-icons">person</span>
        <span>Ognjen Jovanović</span>
      </div>
    </div>

    <div class="modal-footer-line">
      <img src="assets/logo.png" alt="Explorea" class="explorea-logo" />
      <span>Explorea &copy; 2026</span>
    </div>
  </div>
</div>
