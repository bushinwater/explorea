<div class="chat-bubble-wrapper">

  <!-- Panel -->
  <div class="chat-panel" [class.chat-panel--open]="open" role="dialog" [attr.aria-label]="'CHAT.ARIA_LABEL' | translate">
    <div class="chat-header">
      <div class="chat-header-info">
        <span class="material-icons chat-header-icon">smart_toy</span>
        <div>
          <div class="chat-header-title">Explorea AI</div>
          <div class="chat-header-sub">{{ 'CHAT.HEADER_SUB' | translate }}</div>
        </div>
      </div>
      <button class="chat-close-btn" (click)="toggle()" [attr.aria-label]="'COMMON.GO_BACK' | translate">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="chat-messages" (click)="navigateLink($event)">
      <div class="chat-welcome" *ngIf="messages.length === 0">
        <span class="material-icons chat-welcome-icon">explore</span>
        <p *ngIf="isLoggedIn">{{ 'CHAT.HELLO' | translate }}, <strong>{{ firstName }}</strong>! {{ 'CHAT.WELCOME_LOGGED_IN' | translate }}</p>
        <p *ngIf="!isLoggedIn">{{ 'CHAT.WELCOME_GUEST' | translate }}</p>
        <div class="chat-suggestions">
          <button class="suggestion-chip" (click)="sendSuggestion('CHAT.SUGGEST_DESTINATIONS')">{{ 'CHAT.SUGGEST_DESTINATIONS' | translate }}</button>
          <button class="suggestion-chip" (click)="sendSuggestion('CHAT.SUGGEST_EVENTS')">{{ 'CHAT.SUGGEST_EVENTS' | translate }}</button>
          <button class="suggestion-chip" (click)="sendSuggestion('CHAT.SUGGEST_ACTIVITIES')">{{ 'CHAT.SUGGEST_ACTIVITIES' | translate }}</button>
        </div>
      </div>

      <ng-container *ngFor="let msg of messages">
        <div class="chat-message"
             [class.chat-message--user]="msg.role === 'user'"
             [class.chat-message--assistant]="msg.role === 'assistant'">
          <div class="message-bubble" [innerHTML]="formatMessage(msg.content)"></div>
        </div>
      </ng-container>

      <div class="chat-typing" *ngIf="loading">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>

      <div #messagesEnd></div>
    </div>

    <div class="chat-send-error" *ngIf="sendError">
      <span class="material-icons">error_outline</span>
      {{ sendError }}
    </div>

    <div class="chat-input-row">
      <textarea
        #inputEl
        class="chat-input"
        [(ngModel)]="input"
        (ngModelChange)="sendError = ''"
        (keydown)="onKeydown($event)"
        [placeholder]="'CHAT.INPUT_PLACEHOLDER' | translate"
        rows="1"
        [disabled]="loading"
      ></textarea>
      <button class="chat-send-btn" (click)="send()" [disabled]="!input.trim() || loading" [attr.aria-label]="'CHAT.SEND_ARIA' | translate">
        <span class="material-icons">send</span>
      </button>
    </div>
  </div>

  <!-- Trigger button -->
  <button class="chat-fab" (click)="toggle()" [class.chat-fab--open]="open" [attr.aria-label]="'CHAT.ARIA_LABEL' | translate">
    <span class="material-icons">smart_toy</span>
  </button>

</div>
