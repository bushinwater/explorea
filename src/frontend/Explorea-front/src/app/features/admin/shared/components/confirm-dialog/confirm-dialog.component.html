<app-modal-shell [title]="title" [description]="description" (close)="requestCancel()">
  @if (showReasonInput) {
    <textarea
      class="confirm-dialog__reason"
      [placeholder]="reasonPlaceholder"
      [value]="reason"
      (input)="reasonChange.emit($any($event.target).value)"
      rows="3"
    ></textarea>
  }
  <div class="confirm-dialog__actions">
    <button class="btn btn-secondary" type="button" (click)="requestCancel()">
      {{ cancelLabel || ui.t('confirm.cancel') }}
    </button>

    <button class="btn btn-danger" type="button" [disabled]="isLoading" (click)="requestConfirm()">
      {{ isLoading ? (loadingLabel || ui.t('confirm.deleting')) : (confirmLabel || ui.t('confirm.confirm')) }}
    </button>
  </div>
</app-modal-shell>
