<span class="status-badge" [ngClass]="badgeClass">
  <span class="material-icons status-badge__icon">
    @switch (status) {
      @case ('active') { check_circle }
      @case ('inactive') { schedule }
      @case ('pending') { hourglass_empty }
      @default { cancel }
    }
  </span>
  {{ text }}
</span>
