<div class="modal-shell__backdrop" (click)="requestClose()"></div>

<section class="modal-shell" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <header class="modal-shell__header">
    <div>
      <h2 id="modal-title">{{ title }}</h2>
      @if (description) {
        <p>{{ description }}</p>
      }
    </div>

    <button class="modal-shell__close" type="button" (click)="requestClose()" [attr.aria-label]="ui.t('modal.close')">
      <span class="material-icons">close</span>
    </button>
  </header>

  <div class="modal-shell__body">
    <ng-content />
  </div>
</section>
