<app-modal-shell
  [title]="ui.t('users.edit.title')"
  [description]="ui.t('users.edit.description')"
  (close)="requestClose()"
>
  @if (errorMessage) {
    <app-feedback-banner
      variant="error"
      [title]="ui.t('users.form.error')"
      [description]="errorMessage + ' ' + ui.t('users.form.error_hint')"
    />
  }

  <div class="avatar-section">
    <div class="avatar-section__preview">
      @if (avatarPreview() || user.avatarUrl) {
        <img [src]="avatarPreview() || user.avatarUrl" alt="Avatar" class="avatar-section__img" />
      } @else {
        <div class="avatar-section__placeholder">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.582-7 8-7s8 3 8 7"/></svg>
        </div>
      }
      @if (isSavingWithAvatar()) {
        <div class="avatar-section__overlay">
          <span class="avatar-section__spinner"></span>
        </div>
      }
    </div>
    <div class="avatar-section__info">
      <label class="btn btn-secondary avatar-section__btn" [class.disabled]="isSavingWithAvatar() || isSaving">
        {{ ui.t('users.form.change_avatar') }}
        <input type="file" accept="image/*" hidden (change)="onAvatarFileChange($event)" [disabled]="isSavingWithAvatar() || isSaving" />
      </label>
      @if (avatarError()) {
        <span class="avatar-section__error">{{ avatarError() }}</span>
      }
    </div>
  </div>

  <form class="user-form" [formGroup]="form" (ngSubmit)="save()">
    <label class="user-form__field">
      <span>{{ ui.t('users.form.first_name') }}</span>
      <input type="text" formControlName="firstName" />
    </label>

    <label class="user-form__field">
      <span>{{ ui.t('users.form.last_name') }}</span>
      <input type="text" formControlName="lastName" />
    </label>

    <label class="user-form__field user-form__field--full">
      <span>{{ ui.t('users.form.email') }}</span>
      <input type="email" formControlName="email" />
    </label>

    <label class="user-form__field">
      <span>{{ ui.t('users.form.role') }}</span>
      <select formControlName="role">
        @for (role of roles; track role) {
          <option [value]="role">{{ roleLabel(role) }}</option>
        }
      </select>
    </label>

    @if (showLocationFields) {
      <label class="user-form__field">
        <span>{{ ui.t('users.form.region') }}</span>
        <select formControlName="region">
          <option value="">{{ ui.t('users.form.region_none') }}</option>
          @for (region of regions; track region) {
            <option [value]="region">{{ region }}</option>
          }
        </select>
      </label>

      <label class="user-form__field">
        <span>{{ ui.t('users.form.country') }}</span>
        <select formControlName="countryId">
          <option [ngValue]="null">{{ ui.t('users.form.country_none') }}</option>
          @for (country of countries; track country.id) {
            <option [ngValue]="country.id">{{ country.name }}</option>
          }
        </select>
      </label>
    }

    <label class="user-form__field">
      <span>{{ ui.t('users.form.gender') }}</span>
      <select formControlName="gender">
        @for (gender of genders; track gender) {
          <option [value]="gender">{{ genderLabel(gender) }}</option>
        }
      </select>
    </label>

    <label class="user-form__field">
      <span>{{ ui.t('users.form.age') }}</span>
      <input type="number" min="0" max="120" formControlName="age" />
    </label>

    <label class="user-form__field user-form__field--full">
      <span>{{ ui.t('users.form.status') }}</span>
      <select formControlName="status">
        @for (status of statuses; track status) {
          <option [value]="status">{{ statusLabel(status) }}</option>
        }
      </select>
    </label>

    <div class="user-form__actions">
      <button class="btn btn-secondary" type="button" (click)="requestClose()">{{ ui.t('users.form.cancel') }}</button>
      <button class="btn btn-primary" type="submit" [disabled]="isSaving || isSavingWithAvatar()">
        {{ isSaving ? ui.t('users.form.saving') : ui.t('users.form.save_changes') }}
      </button>
    </div>
  </form>
</app-modal-shell>
