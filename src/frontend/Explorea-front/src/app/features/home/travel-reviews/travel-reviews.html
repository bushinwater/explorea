<section class="section travel-reviews" *ngIf="reviews.length">
  <div class="section__header">
    <div>
      <h2 class="section__title">{{ 'HOME.REVIEWS.TITLE' | translate }}</h2>
      <p class="section__subtitle">{{ 'HOME.REVIEWS.SUBTITLE' | translate }}</p>
    </div>
  </div>

  <div class="scroll-row">
    <app-review-card
      *ngFor="let review of reviews"
      [review]="review"
      (imageClicked)="openLightbox($event)" />
  </div>

  <app-reviews-lightbox
    [isOpen]="lightboxOpen"
    [reviews]="reviews"
    [startReviewId]="startReviewId"
    [startImageIndex]="startImageIndex"
    (closed)="lightboxOpen = false" />
</section>
