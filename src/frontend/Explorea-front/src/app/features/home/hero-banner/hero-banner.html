<div class="hero hero--skeleton" *ngIf="!banners.length">
  <div class="hero__skel-img"></div>
</div>

<section class="hero" *ngIf="banners.length">
  <!-- Carousel clip wrapper (drži overflow: hidden samo za slajdove) -->
  <div class="hero__carousel-clip">
    <div
      class="hero__track"
      [class.no-transition]="noTransition"
      [style.transform]="trackTranslate"
      (transitionend)="onTransitionEnd()"
      (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)"
    >
      <div class="hero__slide" *ngFor="let banner of extendedSlides">
        <img [src]="banner.imageUrl" [alt]="banner.title" class="hero__bg" loading="eager" />
        <div class="hero__overlay"></div>
      </div>
    </div>
  </div>

  <!-- Mobile: top gradient s logom -->
  <div class="hero__top-gradient">
    <img src="/assets/logo.png" class="hero__mobile-logo-icon" alt="Explorea" />
    <span class="hero__mobile-logo-text">Explorea</span>
  </div>

  <!-- Content overlay -->
  <div class="hero__content">
    <div class="hero__text">
      <h1 class="hero__title">{{ banners[currentIndex].title }}</h1>
      <p class="hero__subtitle">{{ banners[currentIndex].subtitle }}</p>
    </div>

    <div class="hero__search-wrapper">
      <div class="hero__search">
        <span class="material-icons search-icon">search</span>
        <input
          type="text"
          class="hero__search-input"
          [placeholder]="'HOME.HERO.SEARCH_PLACEHOLDER' | translate"
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearchInput($event)"
          (keydown)="onSearchKeydown($event)"
          (blur)="onSearchBlur()"
          autocomplete="off"
        />
        <button class="btn btn-primary hero__search-btn" (click)="onSearch()">{{ 'HOME.HERO.SEARCH_BTN' | translate }}</button>
      </div>

      <!-- Loading indikator -->
      <div class="hero__dropdown hero__dropdown--loading" *ngIf="searchLoading && !showDropdown">
        <span class="material-icons hero__dropdown-spinner">autorenew</span>
      </div>

      <!-- Live search dropdown -->
      <div class="hero__dropdown" *ngIf="showDropdown">
        <div
          class="hero__dropdown-item"
          *ngFor="let item of searchResults"
          (mousedown)="onSelectResult(item)"
        >
          <span class="material-icons hero__dropdown-icon">{{ getEntityIcon(item.entityType) }}</span>
          <div class="hero__dropdown-text">
            <span class="hero__dropdown-name">{{ item.entity.name }}</span>
            <span class="hero__dropdown-type">{{ item.entityType }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="hero__filters">
      <button
        *ngFor="let city of cityFilters"
        class="hero__filter-chip"
        [class.active]="selectedCityId === city.id"
        (click)="selectCity(city.id)"
      >
        {{ city.id === null ? ('HOME.HERO.POPULAR' | translate) : city.name }}
      </button>
    </div>

    <!-- Dots — unutar content-a da budu iznad gradienta -->
    <div class="hero__dots">
      <button
        *ngFor="let banner of banners; let i = index"
        class="hero__dot"
        [class.active]="i === currentIndex"
        (click)="goTo(i)"
        [attr.aria-label]="'Slajd ' + (i + 1)"
      ></button>
    </div>
  </div>

  <!-- Bottom gradient: prelaz od slike ka pozadini sajta -->
  <div class="hero__bottom-gradient"></div>
</section>
