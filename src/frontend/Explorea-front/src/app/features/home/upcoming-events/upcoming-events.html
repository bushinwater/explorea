<section class="section upcoming-events">
  <div class="section__header">
    <div>
      <h2 class="section__title">{{ 'HOME.EVENTS.TITLE' | translate }}</h2>
    </div>
    <a href="#" class="section__link">{{ 'HOME.EVENTS.VIEW_ALL' | translate }} <span class="material-icons">arrow_forward</span></a>
  </div>

  <div class="scroll-row">
    <app-event-card
      *ngFor="let event of events"
      [event]="event"
    />
  </div>
</section>
